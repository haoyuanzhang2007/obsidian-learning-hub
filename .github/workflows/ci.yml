name: Check plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 build.py
      - name: Check JavaScript entrypoints and modules
        run: |
          node --check main.js
          node --check plugin.js
          for file in modules/*.js; do node --check "$file"; done
      - run: git diff --exit-code -- main.js modules/obsidian-markdown-skill.js
      - run: python3 scripts/package-release.py
